name: CI

on:
  push:
  pull_request:

env:
  CI: '1'

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm run test:unit

      - name: Policy tests
        run: npm run test:policy

      - name: Verify audit log
        run: npm run audit:verify

      - name: Smoke test (MCP stdio handshake)
        run: npm run test:smoke

      # test:inject is deliberately NOT run here: it drives the approval dialog and
      # needs an interactive desktop, which a headless CI runner does not have.
